<!DOCTYPE html>

<head>

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">-->

    <title>Sign Up | Hoteleria</title>
</head>
<body>

    
    <div class="form-container">
        <div class="inner-form-image">  </div>
        <div class="cicle-form">HL</div>
        <form action="#" method="POST">
            <div>
                <label for="email">E-Mail:</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required><br><br>
            </div>
            
            <div>
                 <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="abc!48" required><br><br>
            </div>
            <button type="submit">Enviar</button>
            <p class="form-text">Si no tienes una cuenta <a href="#" target="_blank">regístrate aquí</a>.</p>
        </form>
        
    </div>


    <script src="form-script.js"></script>
</body>
</html>
