# Blueprint de Render: aplicación, PostgreSQL y Key Value (compatible con Redis).
# Los valores con sync: false se piden al crear el Blueprint y no se guardan en Git.
services:
  - type: web
    name: hoteleria-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoteleria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hoteleria-cache
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOTEL_TIMEZONE
        sync: false
      - key: DOMINIO_CORREO
        value: grandstay.com
      - key: DEMO_ACCOUNTS
        value: "false"
      - key: ALGOLIA_APP_ID
        sync: false
      - key: ALGOLIA_ADMIN_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: hoteleria-cache
    plan: free
    ipAllowList: []

databases:
  - name: hoteleria-db
    plan: free
    databaseName: hotel
    user: hotel
    ipAllowList: []
